<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>老師管理系統 - 第17組</title>
  <style>
    :root { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", Arial; }
    body { margin: 0; background:#f6f7fb; color:#111; }
    header { background:#111827; color:#fff; padding:16px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
    header h1 { margin:0; font-size:18px; font-weight:700; }
    main { max-width: 980px; margin: 18px auto; padding: 0 14px; }
    .row { display:flex; gap:12px; flex-wrap:wrap; }
    .card { background:#fff; border-radius:14px; box-shadow:0 6px 22px rgba(0,0,0,.06); padding:14px; }
    .card h2 { margin:0 0 10px; font-size:16px; }
    .fieldRow { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
    .field { display:flex; flex-direction:column; gap:6px; }
    label { font-size:12px; color:#6b7280; }
    input[type=text], input[type=number] { padding:10px 12px; border:1px solid #e5e7eb; border-radius:10px; width: 220px; }
    input[type=number] { width: 140px; }
    button { border:0; padding:10px 12px; border-radius:10px; cursor:pointer; font-weight:600; }
    .btn { background:#2563eb; color:#fff; }
    .btn2 { background:#111827; color:#fff; }
    .btn-outline { background:#fff; border:1px solid #e5e7eb; }
    .btn-danger { background:#ef4444; color:#fff; }
    .muted { color:#6b7280; font-size: 13px; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:10px 8px; border-bottom:1px solid #eef0f4; }
    th { font-size:12px; color:#6b7280; text-transform:uppercase; letter-spacing:.03em; }
    .pill { display:inline-block; padding:3px 8px; border-radius:999px; background:#eef2ff; color:#3730a3; font-size:12px; }
    .err { margin-top:10px; color:#b91c1c; font-weight:600; }
    .ok { margin-top:10px; color:#065f46; font-weight:600; }
    .topRight { display:flex; align-items:center; gap:10px; }
  </style>
</head>
<body>
<header>
  <h1>老師管理系統 - 第17組</h1>
  <div class="topRight">
    <div id="who" class="muted" style="color:#e5e7eb;"></div>
    <button id="logoutBtn" class="btn-outline">登出</button>
  </div>
</header>

<main>
  <div class="row">
    <section class="card" style="flex:1; min-width:320px;">
      <h2>新增課程</h2>
      <div class="fieldRow">
        <div class="field">
          <label>課程名稱 (title)</label>
          <input id="newTitle" type="text" placeholder="e.g. Operating Systems" />
        </div>
        <div class="field">
          <label>上限 (capacity)</label>
          <input id="newCap" type="number" min="1" value="60" />
        </div>
        <button class="btn" id="createBtn">新增</button>
      </div>
      <div class="muted" style="margin-top:8px;">本頁呼叫選課服務（B：8082）的管理 API，再由 B 轉呼叫課程服務（A：8081）。</div>
      <div id="msg" class=""></div>
    </section>

    <section class="card" style="flex:1; min-width:320px;">
      <h2>更新課程</h2>
      <div class="fieldRow">
        <div class="field">
          <label>課程代號 (id)</label>
          <input id="updId" type="number" min="1" placeholder="1" />
        </div>
        <div class="field">
          <label>課程名稱 (title)</label>
          <input id="updTitle" type="text" placeholder="留空=不改" />
        </div>
        <div class="field">
          <label>上限 (capacity)</label>
          <input id="updCap" type="number" min="1" placeholder="留空=不改" />
        </div>
        <button class="btn2" id="updateBtn">更新</button>
      </div>
      <div class="muted" style="margin-top:8px;">注意：capacity 不能小於 enrolled，否則 A 會回 409/400。</div>
    </section>
  </div>

  <section class="card" style="margin-top:12px;">
    <div class="row" style="align-items:center; justify-content:space-between;">
      <h2 style="margin:0;">課程清單（管理）</h2>
      <div style="display:flex; gap:8px; align-items:center;">
        <input id="delId" type="number" min="1" placeholder="要刪除的 id" style="width:160px;" />
        <button class="btn-danger" id="deleteBtn">刪除</button>
        <button class="btn" id="refreshBtn">重新整理</button>
      </div>
    </div>
    <div class="muted" style="margin:8px 0 10px;">可新增 / 更新 / 刪除課程，並檢視 enrolled/capacity。</div>
    <div id="tableWrap"></div>
  </section>
</main>

<script>
  const API = "http://localhost:8082";

  // ---- simple login guard ----
  (function guard() {
    const role = sessionStorage.getItem("ocp.role");
    if (role !== "TEACHER") {
      location.href = "/";
      return;
    }
    const username = sessionStorage.getItem("ocp.username") || "";
    document.getElementById("who").textContent = `登入中：${username}（老師）`;
  })();

  document.getElementById("logoutBtn").addEventListener("click", () => {
    sessionStorage.clear();
    location.href = "/";
  });

  const elMsg = document.getElementById("msg");
  const elTableWrap = document.getElementById("tableWrap");

  function setMsg(type, text) {
    elMsg.className = type === "ok" ? "ok" : (type === "err" ? "err" : "");
    elMsg.textContent = text || "";
  }

  async function apiJson(path, options = {}) {
    const res = await fetch(API + path, {
      headers: { "Content-Type": "application/json" },
      ...options,
    });
    if (!res.ok) throw new Error(await res.text());
    // delete 204
    if (res.status === 204) return null;
    return res.json();
  }

  async function loadCourses() {
    const courses = await apiJson("/admin/courses");
    renderTable(courses);
  }

  function renderTable(courses) {
    const rows = (courses || []).map(c => `
      <tr>
        <td><span class="pill">#${c.id}</span></td>
        <td>${c.title}</td>
        <td>${c.enrolled} / ${c.capacity}</td>
      </tr>
    `).join("");

    elTableWrap.innerHTML = `
      <table>
        <thead>
          <tr><th>課程代號</th><th>課程名稱</th><th>已選/上限</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  document.getElementById("refreshBtn").addEventListener("click", async () => {
    try {
      setMsg("", "");
      await loadCourses();
    } catch (e) {
      setMsg("err", "讀取失敗：" + e.message);
    }
  });

  document.getElementById("createBtn").addEventListener("click", async () => {
    try {
      setMsg("", "");
      const title = document.getElementById("newTitle").value.trim();
      const capacity = parseInt(document.getElementById("newCap").value, 10);
      if (!title) throw new Error("title 必填");
      if (!capacity || capacity <= 0) throw new Error("capacity 必須 > 0");
      const created = await apiJson("/admin/courses", {
        method: "POST",
        body: JSON.stringify({ title, capacity }),
      });
      setMsg("ok", `新增成功：#${created.id}`);
      document.getElementById("newTitle").value = "";
      await loadCourses();
    } catch (e) {
      setMsg("err", "新增失敗：" + e.message);
    }
  });

  document.getElementById("updateBtn").addEventListener("click", async () => {
    try {
      setMsg("", "");
      const id = parseInt(document.getElementById("updId").value, 10);
      if (!id) throw new Error("id 必填");

      const titleRaw = document.getElementById("updTitle").value.trim();
      const capRaw = document.getElementById("updCap").value.trim();

      // 先抓現況，避免你只改一個欄位就把其他欄位清空
      const current = await apiJson(`/admin/courses/${id}`);
      const payload = {
        title: titleRaw ? titleRaw : current.title,
        capacity: capRaw ? parseInt(capRaw, 10) : current.capacity,
      };

      const updated = await apiJson(`/admin/courses/${id}` , {
        method: "PUT",
        body: JSON.stringify(payload),
      });
      setMsg("ok", `更新成功：#${updated.id}`);
      await loadCourses();
    } catch (e) {
      setMsg("err", "更新失敗：" + e.message);
    }
  });

  document.getElementById("deleteBtn").addEventListener("click", async () => {
    try {
      setMsg("", "");
      const id = parseInt(document.getElementById("delId").value, 10);
      if (!id) throw new Error("請輸入要刪除的 id");
      await apiJson(`/admin/courses/${id}`, { method: "DELETE" });
      setMsg("ok", `刪除成功：#${id}`);
      await loadCourses();
    } catch (e) {
      setMsg("err", "刪除失敗：" + e.message);
    }
  });

  loadCourses();
</script>
</body>
</html>
